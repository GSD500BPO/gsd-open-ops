# Optional docs site. Prepared, NOT enabled. After the repo is public:
#   pip install mkdocs-material && mkdocs gh-deploy
site_name: GSD Open Ops
site_description: Open-source appointment-setting and BPO operations kit by GSD 500 BPO
site_url: https://gsd500bpo.github.io/gsd-open-ops/
repo_url: https://github.com/GSD500BPO/gsd-open-ops
repo_name: GSD500BPO/gsd-open-ops
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: green
  font:
    text: Poppins
    code: Space Mono
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
plugins: [search]
markdown_extensions: [tables, admonition, toc: {permalink: true}]
nav:
  - Home: index.md
  - Getting started: GETTING-STARTED.md
  - How we built it: how-we-built-it.md
  - Use cases:
      - Water-treatment dealer nurture: use-cases/water-treatment-dealer-nurture.md
      - Storm-season pivot: use-cases/storm-season-pivot.md
      - 100 applicants to a top 10: use-cases/recruiting-100-to-top-10.md
      - Speed to lead and routing: use-cases/speed-to-lead-routing.md
      - Door-to-door data to CRM: use-cases/door-to-door-data-to-crm.md
      - Train a setter in a week: use-cases/train-a-setter-in-a-week.md
      - CRM-agnostic setup: use-cases/crm-agnostic-setup.md
      - B2B outreach, validation first: use-cases/restaurant-b2b-outreach.md
  - GitHub settings: GITHUB-SETTINGS.md
